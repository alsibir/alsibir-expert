name: Prepare legacy address redirects
on:
  push:
    branches: [main]
    paths: ['.github/workflows/refresh-redirects.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: legacy-address
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out redirect repository
        uses: actions/checkout@v4
        with:
          path: legacy
      - name: Check out published site source
        uses: actions/checkout@v4
        with:
          repository: alsibir/aps-expert
          ref: c4afecb51057df0a8f32b106c6b56b1da8bef1a2
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install dependencies
        working-directory: source
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - name: Render diagrams
        working-directory: source
        run: npm run diagrams:render
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
          MERMAID_NO_SANDBOX: "1"
      - name: Build and verify published source
        working-directory: source
        run: |
          npm run build
          python3 scripts/audit.py
          python3 scripts/audit-anchors.py
          npm run test:pdf
          node scripts/prepare-legacy-site.mjs
      - name: Commit compatibility pages and retained downloads
        working-directory: legacy
        run: |
          set -euo pipefail
          cp -a ../source/out/legacy-site/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish legacy redirects and preserve direct file URLs"
            git push origin HEAD:main
          fi
      - name: Save compatibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: legacy-site
          path: source/out/legacy-site/
          include-hidden-files: true
